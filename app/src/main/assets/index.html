
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(ellipse at center,#173e69,#080d20 80%);
 color:white;font-family:Arial;height:100vh;overflow:hidden;
}
header{
 height:12vh;padding:25px 45px;display:flex;
 justify-content:space-between;align-items:center;
}
.logo{font-size:28px;font-weight:bold;letter-spacing:3px}
.info{font-size:19px;color:#b8cbe9}
main{
 height:65vh;display:flex;align-items:center;
 justify-content:center;gap:24px;
}
.app{
 width:145px;height:145px;border-radius:30px;
 background:linear-gradient(145deg,#263f61,#101b32);
 border:2px solid #526987;
 display:flex;align-items:center;justify-content:center;
 font-size:55px;flex-shrink:0;opacity:.65;
 transition:all .35s ease;
}
.app.selected{
 width:280px;height:280px;font-size:110px;
 opacity:1;border:3px solid #55caff;
 box-shadow:0 0 55px #168fff;
 transform:scale(1.04);
}
.name{text-align:center;font-size:30px;font-weight:bold}
footer{
 position:absolute;bottom:35px;width:100%;
 text-align:center;color:#a9bedf;font-size:18px;
}
</style>
</head>
<body>
<header>
<div class="logo">H96 MODERN</div>
<div class="info">SMART TV</div>
</header>
<main id="apps"></main>
<div class="name" id="name">Netflix</div>
<footer>◀ ▶ NAVEGAR　 ENTER SELECCIONAR</footer>
<script>
const items=[
["🎬","Netflix"],
["▶️","YouTube"],
["📺","Prime Video"],
["🎞️","Disney+"],
["🎮","Juegos"],
["⚙️","Ajustes"],
["🌐","Navegador"]
];
let current=0;
function render(){
 const area=document.getElementById("apps");
 area.innerHTML="";
 items.forEach((item,i)=>{
 const el=document.createElement("div");
 el.className="app"+(i===current?" selected":"");
 el.textContent=item[0];
 area.appendChild(el);
 });
 document.getElementById("name").textContent=items[current][1];
}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")current=(current+1)%items.length;
 if(e.key==="ArrowLeft")current=(current-1+items.length)%items.length;
 render();
});
render();
</script>
</body>
</html>
